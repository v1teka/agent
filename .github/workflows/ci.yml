name: CI/CD

# Tests run on every pull request and every push to main.
# After a push to main the bot is updated on the VPS, if the VPS secrets are set.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button: tests + deploy of main by hand

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Dockerfile
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::VPS_HOST or VPS_SSH_KEY is not set, skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS is not set, trusting the server key seen now."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: Update the bot on the VPS
        if: steps.check.outputs.skip != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          # Pull first, so install.sh runs as it is in the new commit.
          $SUDO git -C /opt/agent pull --ff-only -q
          $SUDO bash /opt/agent/deploy/install.sh
          cd /opt/agent && $SUDO docker compose ps
          REMOTE
